spring.profiles.active=local

# 한국투자증권(KIS) API 설정 — 앱키·시크릿은 application-local.properties 에만 둡니다 (깃 제외)
kis.base-url=https://openapi.koreainvestment.com:9443
kis.ws-url=ws://ops.koreainvestment.com:21000
kis.app-key=${KIS_APP_KEY:}
kis.app-secret=${KIS_APP_SECRET:}

# OpenDART (최근 실적) — 키는 application-local.properties 에 dart.api-key=... 로 넣습니다
dart.base-url=https://opendart.fss.or.kr
dart.api-key=${DART_API_KEY:}

# 네이버 뉴스 검색 (관련 기사) — NAVER API HUB 키를 application-local.properties 에 naver.client-id / naver.client-secret 로 넣습니다
# 네이버 개발자센터 키를 쓸 때만 application-local.properties 에 naver.provider=developers 를 추가합니다
naver.provider=apihub
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}

# FastAPI AI 서버
ai.base-url=http://localhost:8000

# 브라우저 출처 (CORS · WebSocket)
app.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# 로그인 세션 쿠키 (자바스크립트에서 읽을 수 없고, 다른 사이트에서 보낸 요청에는 붙지 않음)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 회원은 app_user 로 관리하므로 Spring Security 기본 계정을 만들지 않습니다
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# Kafka — 실시간 체결이 Kafka 를 거칩니다. Kafka 없이 실행하려면 false 로 바꾸세요
app.kafka.enabled=true
app.kafka.topic=stock-quotes-v1
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=stock-dashboard
spring.kafka.consumer.auto-offset-reset=latest
# Kafka 가 응답하지 않을 때 실시간 수신이 오래 멈추지 않도록 짧게 기다립니다
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=2000

# MariaDB — DB 가 없으면 자동 생성 (createDatabaseIfNotExist)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/stock_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 시작할 때 schema.sql · data.sql 실행 (반복 실행해도 안전)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# MyBatis (애너테이션 매퍼 사용)
mybatis.configuration.map-underscore-to-camel-case=true