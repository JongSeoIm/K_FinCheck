spring.application.name=stock-api
server.port=8085

# ===== 비밀 값은 backend/.env 파일에서 읽는다 =====
# .env 는 Git에 올리지 않는다 (.gitignore). 형식은 .env.example 참고.
spring.config.import=optional:file:./.env[.properties]

# ===== DB =====
# 기본은 MariaDB. stockdb 데이터베이스가 없으면 자동으로 만든다.
# allowPublicKeyRetrieval: 로컬 DB가 SHA2 인증 방식일 때 접속 오류(RSA public key)를 막기 위한 옵션
# MariaDB 없이 실행하려면 .env 에서 DB_URL·DB_DRIVER 를 H2 값으로 바꾼다.
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/stockdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 서버 시작 시 schema.sql(테이블) + data.sql(지원 종목)을 실행한다.
spring.sql.init.mode=always

mybatis.type-aliases-package=com.hk.stock.dtos
mybatis.mapper-locations=classpath:/mybatis/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ===== 프론트엔드 주소 (CORS·WebSocket 허용) =====
app.allowed-origins=http://localhost:8086,http://localhost:3000

# ===== 시세 제공처 선택 =====
# kis: KIS 실제 시세 / auto: KIS 키가 있으면 KIS, 없으면 모의 데이터 / demo: 모의 데이터
market.provider=${MARKET_PROVIDER:auto}

# ===== 한국투자증권 KIS Open API =====
kis.app-key=${KIS_APP_KEY:}
kis.app-secret=${KIS_APP_SECRET:}
kis.rest-url=${KIS_REST_URL:https://openapi.koreainvestment.com:9443}
kis.ws-url=${KIS_WS_URL:ws://ops.koreainvestment.com:21000/tryitout/H0STCNT0}
# 접근 토큰은 하루 단위로 재사용해야 하므로 파일에 보관한다 (.gitignore 대상)
kis.token-cache-file=${KIS_TOKEN_CACHE_FILE:./.kis-token.json}
# REST 요청 사이 최소 간격(ms). 신규 키는 초당 호출 한도가 낮을 수 있어 여유 있게 둔다.
kis.min-interval-ms=${KIS_MIN_INTERVAL_MS:250}

# ===== 종목 뉴스: NAVER API HUB 검색 API (뉴스) =====
# 네이버 클라우드 플랫폼 콘솔 > NAVER API HUB > Application 등록(검색 API) 후 Client ID / Secret 을 .env 에 넣는다
# (기존 developers.naver.com 의 검색 API는 NAVER API HUB 로 옮겨졌다)
naver.news.client-id=${NAVER_CLIENT_ID:}
naver.news.client-secret=${NAVER_CLIENT_SECRET:}
# 같은 종목의 뉴스를 다시 조회하지 않는 시간 (초). 메모리에만 두고 서버를 재시작하면 사라진다
naver.news.cache-seconds=${NAVER_NEWS_CACHE_SECONDS:300}

# ===== 기업 실적: OpenDART (금융감독원 전자공시) =====
# opendart.fss.or.kr > 인증키 신청/관리 에서 발급한 40자리 키를 .env 의 DART_API_KEY 에 넣는다
# 받은 실적은 financial_report·financial_value 테이블에 저장해 두고 다시 쓴다
dart.api-key=${DART_API_KEY:}

# ===== AI 서버 (Python FastAPI, ai-server 폴더) =====
ai.server-url=${AI_SERVER_URL:http://localhost:8087}
# FastAPI 와 같은 값을 넣으면 우리 Spring 서버만 AI 서버를 부를 수 있다 (비우면 검사 안 함, 로컬 개발용)
ai.internal-key=${AI_INTERNAL_KEY:}
# AI 답변 대기 시간(초). Tool 조회(각 5초) + OpenAI 답변 생성 시간을 합친 여유값
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

# ===== Kafka: KIS 체결을 발행하고 다시 소비해 최신 시세·봉에 반영한다 =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=stock-api
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.missing-topics-fatal=false
market.kafka.quote-topic=stock-quotes-v1
market.kafka.heartbeat-topic=stock-feed-heartbeat-v1
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# Kafka가 멈춰 있어도 발행 스레드가 오래 묶이지 않게 한다
spring.kafka.producer.properties.max.block.ms=3000

# Kafka 가 멈췄을 때 같은 로그가 쏟아지지 않게 한다 (상태는 화면과 QuoteKafkaProducer 로그로 확인)
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.springframework.kafka.support.LoggingProducerListener=OFF
