server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: k-fincheck-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/k_fincheck?connectTimeout=3000&socketTimeout=5000}
    username: ${DB_USERNAME:k_fincheck_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 5000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  config:
    import:
      - optional:application-local.yml

auth:
  login-limit:
    per-account: ${LOGIN_LIMIT_PER_ACCOUNT:5}
    per-ip: ${LOGIN_LIMIT_PER_IP:20}
    lock-minutes: ${LOGIN_LIMIT_LOCK_MINUTES:10}

api:
  limit:
    auth-per-minute: ${API_LIMIT_AUTH_PER_MINUTE:30}
    report-per-minute: ${API_LIMIT_REPORT_PER_MINUTE:5}
    price-per-minute: ${API_LIMIT_PRICE_PER_MINUTE:60}
    chart-per-minute: ${API_LIMIT_CHART_PER_MINUTE:40}
    default-per-minute: ${API_LIMIT_DEFAULT_PER_MINUTE:60}
    per-day: ${API_LIMIT_PER_DAY:20000}
    suspend-after-violations: ${API_LIMIT_SUSPEND_AFTER:20}
    suspend-minutes: ${API_LIMIT_SUSPEND_MINUTES:10}

chat:
  limit:
    per-minute: ${CHAT_LIMIT_PER_MINUTE:5}
    per-day: ${CHAT_LIMIT_PER_DAY:100}
    daily-tokens: ${CHAT_LIMIT_DAILY_TOKENS:200000}
    monthly-tokens: ${CHAT_LIMIT_MONTHLY_TOKENS:0}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    default-statement-timeout: 5

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: 2s
  read-timeout: 30s

kis:
  base-url: https://openapi.koreainvestment.com:9443
  app-key: YOUR_APP_KEY
  app-secret: YOUR_APP_SECRET

