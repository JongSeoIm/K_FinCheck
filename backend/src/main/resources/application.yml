server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: k-fincheck-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/k_fincheck?connectTimeout=3000&socketTimeout=5000}
    username: ${DB_USERNAME:k_fincheck_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 5000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  config:
    import:
      - optional:application-local.yml

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    default-statement-timeout: 5

kis:
  base-url: https://openapi.koreainvestment.com:9443
  app-key: YOUR_APP_KEY
  app-secret: YOUR_APP_SECRET

