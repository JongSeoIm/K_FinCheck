server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: k-fincheck-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/k_fincheck?connectTimeout=3000&socketTimeout=5000}
    username: ${DB_USERNAME:k_fincheck_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 5000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  config:
    import:
      - optional:application-local.yml

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    default-statement-timeout: 5

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: 2s
  read-timeout: 60s  # 사업보고서 첫 색인(원문 다운로드·벡터화)이 오래 걸릴 수 있어 늘림

kis:
  base-url: https://openapi.koreainvestment.com:9443
  app-key: YOUR_APP_KEY
  app-secret: YOUR_APP_SECRET


# 일봉·공시 미리 저장 (MarketDataCollector). false 면 조회할 때 없는 날짜만 받아 저장한다.
market-data:
  collect:
    enabled: ${MARKET_DATA_COLLECT_ENABLED:true}

# AI 비용 관리 (ChatUsageGuard). 0 이면 해당 제한을 끈다.
chat:
  limit:
    per-minute: ${CHAT_LIMIT_PER_MINUTE:5}
    per-day: ${CHAT_LIMIT_PER_DAY:100}
    daily-tokens: ${CHAT_LIMIT_DAILY_TOKENS:200000}
    monthly-tokens: ${CHAT_LIMIT_MONTHLY_TOKENS:0}  # 서비스 전체 월 토큰 상한, 0 이면 끔

# 로그인 시도 제한 (LoginAttemptGuard). 10분 안에 틀린 횟수, 넘으면 잠금. 0 이면 끈다.
auth:
  login-limit:
    per-account: ${LOGIN_LIMIT_PER_ACCOUNT:5}   # 같은 아이디 + 같은 IP
    per-ip: ${LOGIN_LIMIT_PER_IP:20}            # 같은 IP (아이디를 바꿔 가며 시도)
    lock-minutes: ${LOGIN_LIMIT_LOCK_MINUTES:10}

# 챗봇 외 API 호출 제한 (ApiRateLimitInterceptor). 로그인 사용자별, 아니면 IP별 1분 횟수. 0 이면 끈다.
api:
  limit:
    report-per-minute: ${API_LIMIT_REPORT_PER_MINUTE:5}     # 사업보고서 (OpenDART 원문·임베딩)
    price-per-minute: ${API_LIMIT_PRICE_PER_MINUTE:60}      # 현재가 (정상 화면 약 10~20회)
    chart-per-minute: ${API_LIMIT_CHART_PER_MINUTE:40}      # 차트 candles·intraday (정상 약 1~10회)
    default-per-minute: ${API_LIMIT_DEFAULT_PER_MINUTE:60}  # 실적·공시·뉴스·투자의견·일정·관심 종목 등
    per-day: ${API_LIMIT_PER_DAY:20000}                     # 계정별 하루 전체 (화면을 24시간 켜 둬도 약 1.3만 회)
    suspend-after-violations: ${API_LIMIT_SUSPEND_AFTER:20}  # 10분 안에 1분 한도로 이만큼 막히면
    suspend-minutes: ${API_LIMIT_SUSPEND_MINUTES:10}         # 이 시간 동안 조회·챗봇 모두 정지
