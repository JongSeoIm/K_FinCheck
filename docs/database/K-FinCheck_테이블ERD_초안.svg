<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">K-FinCheck 테이블 ERD 초안</title>
  <desc id="desc">회원, 기업, 관심 종목, 공시 보고서, 재무 수치 테이블의 일대다 관계를 나타낸 ERD</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .meta-label { font: 700 15px Arial, sans-serif; fill: #374151; }
      .meta-value { font: 400 15px Arial, sans-serif; fill: #111827; }
      .entity-title { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .field { font: 400 14px Arial, sans-serif; fill: #1f2937; }
      .field-key { font: 700 13px Arial, sans-serif; fill: #1f2937; }
      .rel { font: 700 13px Arial, sans-serif; fill: #475569; }
      .legend { font: 400 13px Arial, sans-serif; fill: #374151; }
      .frame-title { font: 600 12px Arial, sans-serif; fill: #475569; }
      .area-title { font: 700 16px Arial, sans-serif; fill: #1f2937; }
    </style>
    <marker id="one" markerWidth="10" markerHeight="16" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 -8 10 16">
      <path d="M1,-7 V7" fill="none" stroke="#64748b" stroke-width="2"/>
    </marker>
    <marker id="zero-many" markerWidth="24" markerHeight="18" refX="23" refY="0" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 -9 24 18">
      <circle cx="6" cy="0" r="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <path d="M10,0 H18 M18,0 L23,-7 M18,0 L23,0 M18,0 L23,7" fill="none" stroke="#64748b" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="1440" height="1040" fill="#ffffff"/>
  <rect x="16" y="12" width="1408" height="1016" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="548" y="4" width="344" height="18" fill="#ffffff"/>
  <text x="720" y="18" class="frame-title" text-anchor="middle">K-FinCheck 데이터베이스 ERD</text>

  <rect x="40" y="130" width="1360" height="790" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="54" y="120" width="220" height="22" fill="#ffffff"/>
  <text x="64" y="138" class="area-title">투자정보 서비스(KFC)</text>

  <text x="48" y="54" class="title">K-FinCheck 테이블 ERD</text>
  <line x1="48" y1="72" x2="1392" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="100" class="meta-label">ERD ID</text>
  <text x="115" y="100" class="meta-value">KFC_ERD_001</text>
  <text x="290" y="100" class="meta-label">ERD 명</text>
  <text x="355" y="100" class="meta-value">K-FinCheck 데이터베이스</text>

  <!-- Relationships -->
  <path d="M340 292 H410" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#zero-many)"/>

  <path d="M720 292 H650" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#zero-many)"/>

  <path d="M845 412 V500" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#zero-many)"/>

  <path d="M970 676 H1040" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#zero-many)"/>

  <!-- app_user -->
  <g>
    <rect x="60" y="160" width="280" height="264" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="60" y="160" width="280" height="44" fill="#273449"/>
    <text x="78" y="188" class="entity-title">app_user</text>
    <line x1="60" y1="238" x2="340" y2="238" stroke="#cbd5e1"/>
    <text x="78" y="228" class="field-key">PK</text><text x="118" y="228" class="field">user_id  BIGINT UNSIGNED</text>
    <text x="78" y="260" class="field-key">UK</text><text x="118" y="260" class="field">login_id  VARCHAR(50)</text>
    <text x="78" y="292" class="field">password_hash  VARCHAR(255)</text>
    <text x="78" y="324" class="field">nickname  VARCHAR(30)</text>
    <text x="78" y="356" class="field">created_at  DATETIME</text>
    <text x="78" y="388" class="field">updated_at  DATETIME</text>
  </g>

  <!-- watchlist -->
  <g>
    <rect x="410" y="196" width="240" height="192" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="410" y="196" width="240" height="44" fill="#273449"/>
    <text x="428" y="224" class="entity-title">watchlist</text>
    <line x1="410" y1="274" x2="650" y2="274" stroke="#cbd5e1"/>
    <text x="428" y="264" class="field-key">PK, FK</text><text x="490" y="264" class="field">user_id</text>
    <text x="428" y="306" class="field-key">PK, FK</text><text x="490" y="306" class="field">stock_code</text>
    <text x="428" y="348" class="field">created_at  DATETIME</text>
  </g>

  <!-- company -->
  <g>
    <rect x="720" y="160" width="250" height="252" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="720" y="160" width="250" height="44" fill="#273449"/>
    <text x="738" y="188" class="entity-title">company</text>
    <line x1="720" y1="238" x2="970" y2="238" stroke="#cbd5e1"/>
    <text x="738" y="228" class="field-key">PK</text><text x="778" y="228" class="field">stock_code  VARCHAR(6)</text>
    <text x="738" y="260" class="field">company_name  VARCHAR(100)</text>
    <text x="738" y="292" class="field">market_type  VARCHAR(20)</text>
    <text x="738" y="324" class="field-key">UK</text><text x="778" y="324" class="field">dart_corp_code  VARCHAR(8)</text>
    <text x="738" y="356" class="field">created_at  DATETIME</text>
    <text x="738" y="388" class="field">updated_at  DATETIME</text>
  </g>

  <!-- financial_report -->
  <g>
    <rect x="680" y="500" width="290" height="352" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="680" y="500" width="290" height="44" fill="#273449"/>
    <text x="698" y="528" class="entity-title">financial_report</text>
    <line x1="680" y1="578" x2="970" y2="578" stroke="#cbd5e1"/>
    <text x="698" y="568" class="field-key">PK</text><text x="748" y="568" class="field">report_id  BIGINT UNSIGNED</text>
    <text x="698" y="608" class="field-key">FK</text><text x="748" y="608" class="field">stock_code  VARCHAR(6)</text>
    <text x="698" y="648" class="field-key">UK1</text><text x="748" y="648" class="field">receipt_no  VARCHAR(14)</text>
    <text x="698" y="688" class="field">business_year  SMALLINT</text>
    <text x="698" y="728" class="field">report_code  VARCHAR(5)</text>
    <text x="698" y="768" class="field-key">UK1</text><text x="748" y="768" class="field">fs_div  VARCHAR(3)</text>
    <text x="698" y="808" class="field">collected_at  DATETIME</text>
  </g>

  <!-- financial_value -->
  <g>
    <rect x="1040" y="460" width="340" height="432" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="1040" y="460" width="340" height="44" fill="#273449"/>
    <text x="1058" y="488" class="entity-title">financial_value</text>
    <line x1="1040" y1="538" x2="1380" y2="538" stroke="#cbd5e1"/>
    <text x="1058" y="528" class="field-key">PK</text><text x="1120" y="528" class="field">value_id  BIGINT UNSIGNED</text>
    <text x="1058" y="564" class="field-key">FK, UK1</text><text x="1120" y="564" class="field">report_id  BIGINT UNSIGNED</text>
    <text x="1058" y="600" class="field-key">UK1</text><text x="1120" y="600" class="field">account_code  VARCHAR(50)</text>
    <text x="1058" y="636" class="field">account_name  VARCHAR(100)</text>
    <text x="1058" y="672" class="field">source_account_id  VARCHAR(200)</text>
    <text x="1058" y="708" class="field">source_account_name  VARCHAR(200)</text>
    <text x="1058" y="744" class="field">current_amount  DECIMAL(30,2)</text>
    <text x="1058" y="780" class="field">previous_amount  DECIMAL(30,2)</text>
    <text x="1058" y="816" class="field">currency  VARCHAR(3)</text>
    <text x="1058" y="852" class="field">value_status  VARCHAR(30)</text>
  </g>

  <!-- Legend -->
  <line x1="48" y1="948" x2="1392" y2="948" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="984" class="meta-label">범례</text>
  <text x="108" y="984" class="legend">PK 기본키</text>
  <text x="210" y="984" class="legend">FK 외래키</text>
  <text x="310" y="984" class="legend">UK 고유키</text>
  <text x="420" y="984" class="legend">UK1 동일 번호는 하나의 복합 고유키</text>
  <path d="M690 979 H750" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#one)" marker-end="url(#zero-many)"/>
  <text x="770" y="984" class="legend">부모 1건에 자식이 없거나 여러 건 존재</text>
</svg>
